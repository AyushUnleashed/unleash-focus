<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locked</title>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("fonts/archivo.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
      }

      :root {
        --prussian: #12305e;
        --brass: #e7b541;
        --fg: #f1f4f8;
        --muted: #b4c2da;
      }

      html { background: var(--prussian); }

      body {
        display: grid;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding-block: 48px;
        padding-inline: clamp(24px, 9vw, 140px);
        box-sizing: border-box;
        background: var(--prussian);
        color: var(--fg);
        font: 400 19px/1.55 "Archivo", system-ui, sans-serif;
      }

      main { min-width: 0; }

      /* Same closed padlock as the popup. */
      .padlock { display: block; width: 64px; height: auto; }
      .padlock path { fill: none; stroke: #d5dce6; stroke-width: 12; }
      .padlock .lock-body { fill: var(--brass); }
      .padlock .keyhole { fill: var(--prussian); }

      /* The domain stays on one line; blocked.js shrinks it to fit the width. */
      h1 {
        margin: 32px 0 10px;
        font-size: clamp(44px, 9vw, 128px);
        white-space: nowrap;
        line-height: 0.92;
        font-weight: 900;
        font-stretch: 125%;
        letter-spacing: -0.025em;
        overflow-wrap: anywhere;
      }

      .lead {
        margin: 0 0 28px;
        font-size: clamp(22px, 2.6vw, 30px);
        font-stretch: 110%;
      }

      .note {
        max-width: 34em;
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="padlock" viewBox="0 0 120 140" aria-hidden="true">
        <path d="M38 72 V46 a22 22 0 0 1 44 0 V72" />
        <rect class="lock-body" x="14" y="62" width="92" height="74" rx="16" />
        <g class="keyhole">
          <circle cx="60" cy="92" r="8.5" />
          <rect x="56.25" y="95" width="7.5" height="19" rx="2.5" />
        </g>
      </svg>
      <h1 id="site">This site</h1>
      <p class="lead">is locked while you focus.</p>
      <p class="note">When you're done, open Focus Lock in your toolbar and unlock your sites.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
